name: HunarDaily Android CI & APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  analyze-test-build:
    name: Analyze, Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart versions
        run: flutter --version

      - name: Install Dart/Flutter dependencies
        run: flutter pub get

      - name: Run static code analysis
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test --reporter expanded

      - name: Sync Android Gradle config with installed Flutter SDK
        id: sync_android
        run: |
          rm -rf /tmp/tpl_app
          flutter create --platforms=android --org com.hunardaily --project-name hunardaily /tmp/tpl_app

          for f in settings.gradle.kts build.gradle.kts gradle.properties; do
            if [ -f "/tmp/tpl_app/android/$f" ]; then
              cp -f "/tmp/tpl_app/android/$f" "android/$f"
            fi
          done

          if [ -f "/tmp/tpl_app/android/app/build.gradle.kts" ]; then
            cp -f "/tmp/tpl_app/android/app/build.gradle.kts" "android/app/build.gradle.kts"
            sed -i 's/com\.hunardaily\.hunardaily/com.hunardaily.app/g' android/app/build.gradle.kts
            sed -i '/signingConfig = signingConfigs.getByName("debug")/a\            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")' android/app/build.gradle.kts
          fi

          rm -rf android/gradle
          cp -r /tmp/tpl_app/android/gradle android/gradle

          for wf in gradlew gradlew.bat; do
            if [ -f "/tmp/tpl_app/android/$wf" ]; then
              cp -f "/tmp/tpl_app/android/$wf" "android/$wf"
            fi
          done
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

          FLUTTER_SDK=$(dirname $(dirname $(which flutter)))
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          fi

          GRADLE_VER=$(grep -oE 'gradle-[0-9]+(\.[0-9]+)+' android/gradle/wrapper/gradle-wrapper.properties | head -n 1 | sed 's/gradle-//')
          GRADLE_VER=${GRADLE_VER:-9.3.1}
          echo "Detected Flutter-compatible Gradle version: $GRADLE_VER"
          echo "gradle_version=$GRADLE_VER" >> "$GITHUB_OUTPUT"

      - name: Set up matching Gradle version
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.sync_android.outputs.gradle_version }}

      - name: Ensure Gradle Wrapper jar is ready
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            cd android
            gradle wrapper --gradle-version "${{ steps.sync_android.outputs.gradle_version }}"
            chmod +x gradlew
          fi

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Build Android Release APK (Debug-Signed for Testing)
        run: flutter build apk --release

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hunardaily-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hunardaily-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

name: HunarDaily Android CI & APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  analyze-test-build:
    name: Analyze, Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart versions
        run: flutter --version

      - name: Install Dart/Flutter dependencies
        run: flutter pub get

      - name: Run static code analysis
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test --reporter expanded

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Android local.properties & Gradle Wrapper
        run: |
          FLUTTER_SDK=$(dirname $(dirname $(which flutter)))
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          fi
          cd android
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Build Android Release APK (Debug-Signed for Testing)
        run: flutter build apk --release

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hunardaily-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hunardaily-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
